<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Face Detection & Recognition</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --green: #2ea043;
      --red: #f85149;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      color: var(--text-bright);
      font-size: 26px;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #8b949e;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0e1117;
      border-color: var(--accent);
      font-weight: 600;
    }
    .panel {
      display: none;
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .panel.active { display: block; }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    video, canvas {
      width: 100%;
      display: block;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .btn:hover { background: #2ea043; }
    .btn-secondary {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #30363d; }
    .upload-box {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-box:hover { border-color: var(--accent); }
    .preview-box {
      margin-top: 16px;
      text-align: center;
    }
    .preview-box img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stats-card {
      margin-top: 16px;
      padding: 12px;
      background: #0d1117;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      color: #7ee787;
    }
    .input-group {
      margin-bottom: 14px;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #8b949e;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: #fff;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-known { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #3fb950; }
    .badge-unknown { background: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid #f85149; }
  </style>
</head>
<body>
  <header>
    <h1>Biometric Face Detection & Recognition</h1>
    <p class="subtitle">Deep Neural Networks (YuNet + SFace) &middot; Real-Time Feature Embeddings</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('webcam')">📹 Live Browser Webcam</button>
    <button class="tab-btn" onclick="switchTab('upload')">🖼️ Image Upload</button>
    <button class="tab-btn" onclick="switchTab('enroll')">➕ Enroll Person</button>
  </div>

  <!-- TAB 1: WEBCAM -->
  <div id="tab-webcam" class="panel active">
    <div class="video-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="controls">
      <button id="startCamBtn" class="btn" onclick="startCamera()">Start Camera</button>
      <button id="stopCamBtn" class="btn btn-secondary" onclick="stopCamera()" style="display:none;">Stop Camera</button>
      <button class="btn btn-secondary" onclick="snapAndEnroll()">Enroll Current Face</button>
    </div>
    <div id="webcamStats" class="stats-card" style="display:none;"></div>
  </div>

  <!-- TAB 2: UPLOAD IMAGE -->
  <div id="tab-upload" class="panel">
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <p>📁 Click to select or drop a face photo (.jpg, .png)</p>
      <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
    </div>
    <div class="preview-box" id="uploadPreview" style="display:none;">
      <h4 style="margin: 12px 0; color: var(--text-bright);">Processed Recognition Result:</h4>
      <img id="resultImage" src="" alt="Result">
      <div id="uploadStats" class="stats-card"></div>
    </div>
  </div>

  <!-- TAB 3: ENROLL -->
  <div id="tab-enroll" class="panel">
    <h3 style="margin-bottom: 16px; color: var(--text-bright);">Enroll New Identity</h3>
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="enrollName" placeholder="e.g. Marie Curie">
    </div>
    <div class="input-group">
      <label>Face Photo</label>
      <input type="file" id="enrollFile" accept="image/*">
    </div>
    <button class="btn" onclick="submitEnroll()">Enroll into Database</button>
    <div id="enrollResult" class="stats-card" style="display:none; margin-top:16px;"></div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
    }

    // WEBCAM SCRIPT
    let video = document.getElementById('webcam');
    let overlay = document.getElementById('overlay');
    let ctx = overlay.getContext('2d');
    let stream = null;
    let isProcessing = false;
    let timer = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        document.getElementById('startCamBtn').style.display = 'none';
        document.getElementById('stopCamBtn').style.display = 'inline-block';
        document.getElementById('webcamStats').style.display = 'block';

        video.onloadedmetadata = () => {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
          timer = setInterval(processFrame, 150);
        };
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      clearInterval(timer);
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      document.getElementById('startCamBtn').style.display = 'inline-block';
      document.getElementById('stopCamBtn').style.display = 'none';
    }

    async function processFrame() {
      if (!stream || isProcessing) return;
      isProcessing = true;

      const offscreen = document.createElement('canvas');
      offscreen.width = video.videoWidth;
      offscreen.height = video.videoHeight;
      const offCtx = offscreen.getContext('2d');
      offCtx.drawImage(video, 0, 0);

      const dataUrl = offscreen.toDataURL('image/jpeg', 0.7);

      try {
        const resp = await fetch('/api/detect_frame', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: dataUrl })
        });
        const result = await resp.json();
        drawDetections(result.faces);
        document.getElementById('webcamStats').innerText = 
          `Faces: ${result.count} | Known: ${result.faces.filter(f => f.is_known).length} | Enrolled DB: ${result.enrolled_count}`;
      } catch (e) {
        console.error(e);
      } finally {
        isProcessing = false;
      }
    }

    function drawDetections(faces) {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      if (!faces) return;

      faces.forEach(f => {
        const [x, y, w, h] = f.bbox;
        const color = f.is_known ? '#2ea043' : '#f85149';

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);

        // Badge
        const text = f.is_known ? `${f.name} (${(f.similarity * 100).toFixed(0)}%)` : "Unknown";
        ctx.font = "bold 13px sans-serif";
        const width = ctx.measureText(text).width;
        ctx.fillStyle = color;
        ctx.fillRect(x, Math.max(0, y - 22), width + 12, 22);

        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, x + 6, Math.max(16, y - 6));

        // Landmarks
        if (f.landmarks) {
          ctx.fillStyle = '#ffdf5d';
          f.landmarks.forEach(([lx, ly]) => {
            ctx.beginPath();
            ctx.arc(lx, ly, 3, 0, 2 * Math.PI);
            ctx.fill();
          });
        }
      });
    }

    async function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      const resp = await fetch('/api/annotate_image', {
        method: 'POST',
        body: formData
      });

      if (resp.ok) {
        const blob = await resp.blob();
        document.getElementById('resultImage').src = URL.createObjectURL(blob);
        document.getElementById('uploadPreview').style.display = 'block';
        document.getElementById('uploadStats').innerText = `Processed: ${file.name}`;
      }
    }

    async function submitEnroll() {
      const name = document.getElementById('enrollName').value.trim();
      const file = document.getElementById('enrollFile').files[0];
      if (!name || !file) {
        alert("Please enter a name and choose an image.");
        return;
      }
      const formData = new FormData();
      formData.append('name', name);
      formData.append('file', file);

      const resp = await fetch('/api/enroll', {
        method: 'POST',
        body: formData
      });
      const data = await resp.json();
      const div = document.getElementById('enrollResult');
      div.style.display = 'block';
      div.innerText = data.message || data.error;
    }

    function snapAndEnroll() {
      const name = prompt("Enter name for the person currently in frame:");
      if (!name) return;
      const offscreen = document.createElement('canvas');
      offscreen.width = video.videoWidth;
      offscreen.height = video.videoHeight;
      offscreen.getContext('2d').drawImage(video, 0, 0);
      const dataUrl = offscreen.toDataURL('image/jpeg', 0.9);

      fetch('/api/enroll_frame', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, image: dataUrl })
      }).then(r => r.json()).then(data => {
        alert(data.message || data.error);
      });
    }
  </script>
</body>
</html>
